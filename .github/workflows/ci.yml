name: Code checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: node --import tsx --test tests/*.test.ts tests/*.test.tsx
        env:
          TSX_TSCONFIG_PATH: tests/tsconfig.json
      - run: node --check services/openwa/server.mjs && node --check services/openwa/start.mjs
