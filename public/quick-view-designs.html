function art(n=0){return `<svg class="art" viewBox="0 0 600 420" preserveAspectRatio="xMidYMid slice" aria-label="${T('Illustrative property image','رسم توضيحي للعقار')}" role="img">${kind===0?`<path fill="#f7f9f9" d="M0 0h600v420H0z"/><path fill="#e8f5fe" d="M0 0h600v280H0z"/><path fill="#eff3f4" d="m0 280 600-25v165H0z"/><path fill="#fff" d="M60 42h240v215H60z"/><path fill="#cfd9de" d="M72 54h216v192H72z"/><path fill="#e8f5fe" d="M78 60h204v180H78z"/><path fill="#9aabb5" opacity=".45" d="M84 173h35v67H84zM132 130h50v110h-50zM194 151h40v89h-40zM245 110h31v130h-31z"/><path stroke="#fff" stroke-width="7" fill="none" d="M180 54v192M72 148h216"/><path fill="#fff" d="M343 191h174v102H343z"/><rect x="318" y="242" width="228" height="66" rx="15" fill="${n%2?'#9aabb5':'#cfd9de'}"/><rect x="333" y="205" width="198" height="62" rx="15" fill="#fff"/><rect x="353" y="216" width="54" height="47" rx="10" fill="#e8f5fe"/><rect x="459" y="216" width="54" height="47" rx="10" fill="#eff3f4"/><path fill="#536471" d="M333 302h9v15h-9zM519 302h9v15h-9z"/><ellipse cx="265" cy="343" rx="151" ry="46" fill="#fff"/><ellipse cx="260" cy="330" rx="61" ry="22" fill="#cfd9de"/><path stroke="#536471" stroke-width="5" d="m225 340-8 32m77-32 8 32"/><path fill="#fff" d="M52 265h30l-6 54H58z"/><path fill="#9aabb5" d="M66 273c-41-30-29-56-14-31-11-49 8-61 14-11 12-45 28-33 10 7 28-30 37-13-10 35"/><path stroke="#536471" stroke-width="4" fill="none" d="M548 114v185m-22 0h45"/><path fill="#fff" d="m526 86 43 0 18 49h-78z"/>`:kind===1?`<path fill="#e8f5fe" d="M0 0h600v420H0z"/><path fill="#eff3f4" d="M0 335h600v85H0z"/><path fill="#fff" d="M120 65h300v280H120z"/><path fill="#cfd9de" d="M420 105h66v240h-66z"/>${Array.from({length:3},(_,y)=>Array.from({length:4},(_,x)=>`<path fill="#cfd9de" d="M${149+x*64} ${95+y*73}h38v48h-38z"/><path fill="#e8f5fe" d="M${154+x*64} ${100+y*73}h28v38h-28z"/>`).join('')).join('')}<path fill="#536471" d="M243 286h57v59h-57z"/><path fill="#9aabb5" d="M101 345h404v9H101z"/><path fill="#cfd9de" d="m0 398 600-25v47H0z"/><path fill="#9aabb5" d="M63 273h7v75h-7zM535 274h7v74h-7z"/><circle cx="66" cy="250" r="28" fill="#cfd9de"/><circle cx="538" cy="250" r="28" fill="#cfd9de"/>`:`<path fill="#e8f5fe" d="M0 0h600v420H0z"/><path fill="#eff3f4" d="M0 238h600v182H0z"/><path fill="#cfd9de" d="m48 288 332-83 177 80-333 97z"/><path fill="#fff" d="m80 286 297-74 147 67-296 85z"/><path fill="none" stroke="#1d9bf0" stroke-width="3" stroke-dasharray="8 6" d="m99 285 276-68 129 62-276 79z"/><path fill="#9aabb5" d="M62 148h115v90H62zM436 162h88v88h-88z"/><path fill="#fff" d="M76 161h17v22H76zM106 161h17v22h-17zM137 161h17v22h-17zM448 176h19v25h-19zM485 176h19v25h-19z"/><path fill="#1d9bf0" d="M300 216c0 25-30 45-30 45s-30-20-30-45a30 30 0 0 1 60 0Z"/><circle cx="270" cy="215" r="10" fill="#fff"/>`}</svg>`}
const edit=(field)=>button('edit',T('Edit ','تعديل ')+({price:T('price','السعر'),owner:T('owner','المالك'),status:T('availability','التوفر'),description:T('description','الوصف'),location:T('location','الموقع'),tiktok:T('TikTok link','رابط TikTok')}[field]),`data-edit="${field}"`);
function button(name,label,attrs=''){return `<button type="button" class="icon" aria-label="${E(label)}" data-tip="${E(label)}" ${attrs}>${icon(name)}</button>`}
const copy=(field)=>button('copy',T('Copy','نسخ'),`data-copy="${field}"`);
function badges(){const p=listings[kind];return `<div class="badges"><span class="badge">${kind===0?T('Apartment · For rent','شقة · للإيجار'):kind===1?T('Building · For sale','مبنى · للبيع'):T('Land · For sale','أرض · للبيع')}</span><span class="badge status">${p.status==='available'?T('Available','متاح'):p.status==='rented'?T('Rented','مؤجر'):T('Sold','مباع')}</span>${edit('status')}</div>`}
function price(){const p=listings[kind];return `<div class="price-row"><div class="price"><bdi>${new Intl.NumberFormat(lang==='ar'?'ar-SA':'en-GB').format(p.price)}</bdi><span>${T('SAR','ر.س')}</span><small>${p.period?T('per year','سنويًا'):T('Asking price','السعر المطلوب')}</small></div>${edit('price')}</div>`}
function facts(){return `<div class="facts">${listings[kind].facts.map(([i,value,en,ar])=>`<div class="fact">${icon(i)}<strong>${value==='North'?T('North','شمال'):value}</strong>${T(en,ar)}</div>`).join('')}</div>`}
function description(){return `<section class="section"><div class="section-head"><h4>${T('About this property','عن العقار')}</h4><div class="actions">${edit('description')}${copy('description')}</div></div><p>${E(listings[kind].description[lang==='ar'?1:0])}</p></section>`}
function owner(){return `<section class="owner-card"><div class="section-head"><h4>${icon('user')}${T('Owner information','بيانات المالك')}</h4><div class="actions">${edit('owner')}${copy('owner')}</div></div><div class="owner-row"><div class="avatar">${E(listings[kind].owner.slice(0,1))}</div><div><strong>${E(listings[kind].owner)}</strong><small dir="ltr">${E(listings[kind].phone)}</small></div></div></section>`}
function resources(){return `<div class="resources">${[['location','pin',T('Property location','موقع العقار'),T('Open in Google Maps','فتح في خرائط Google')],['tiktok','video',T('TikTok video','فيديو TikTok'),T('Open video link','فتح رابط الفيديو')]].map(([field,i,title,sub])=>`<div class="resource"><span class="resource-icon">${icon(i)}</span><div><a href="#" data-open="${field}"><strong>${title}</strong></a><small>${sub}</small></div><div class="actions">${edit(field)}${copy(field)}</div></div>`).join('')}</div>`}
function head(){return `<div class="modal-head"><div class="label">${icon('eye')}${T('Quick view','نظرة سريعة')} <small>RE–1041</small></div><div class="actions">${button('share',T('Share property','مشاركة العقار'),'data-share')}${button('close',T('Close preview','إغلاق المعاينة'),'data-close')}</div></div>`}
function foot(){return `<footer class="footer"><small>${icon('user')} ${T('Office preview · demo content','معاينة المكتب · بيانات توضيحية')}</small><a class="primary" href="#" data-details>${T('View full property','عرض تفاصيل العقار')}${icon('arrow')}</a></footer>`}
function title(){const p=listings[kind];return `<h3 class="title">${E(p.title[lang==='ar'?1:0])}</h3><div class="location">${icon('pin')}${E(p.location[lang==='ar'?1:0])}</div>`}
function render(){document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';$('studio').textContent=T('Design studio / Quick view','استوديو التصميم / النظرة السريعة');$('eyebrow').textContent=T('ONE PALETTE. THREE DIRECTIONS.','ألوان واحدة. ثلاث أفكار.');$('heading').textContent=T('A closer look, beautifully simple.','نظرة أقرب، بتفاصيل أوضح.');$('intro').textContent=T('Explore three Quick view layouts with your existing blue, white and slate palette. Switch property types, try mobile, and test the edit and copy actions.','ثلاثة تصاميم للنظرة السريعة بنفس ألوان التطبيق الحالية: الأزرق والأبيض والرمادي. بدّل نوع العقار، جرّب عرض الجوال، واختبر أزرار التعديل والنسخ.');$('palette').textContent=T('Your current palette, unchanged.','لوحة ألوانك الحالية، دون تغيير.');$('design-tabs').innerHTML=names.map((n,i)=>`<button class="tab" aria-pressed="${design===i}" data-design="${i}"><b>0${i+1}</b>${n[lang==='ar'?1:0]}</button>`).join('');$('design-title').textContent=names[design][lang==='ar'?1:0];$('design-number').textContent='0'+(design+1);$('design-description').textContent=descriptions[design][lang==='ar'?1:0];$('samples').innerHTML=[T('Apartment','شقة'),T('Building','مبنى'),T('Land','أرض')].map((label,i)=>`<button class="sample" aria-pressed="${kind===i}" data-kind="${i}">${label}</button>`).join('');$('devices').innerHTML=[['desktop',T('Desktop','حاسوب')],['mobile',T('Mobile','جوال')]].map(([i,label],n)=>`<button aria-label="${label}" title="${label}" aria-pressed="${Boolean(n)===mobile}" data-mobile="${n}">${icon(i)}</button>`).join('');
 let body=design===0?`<article class="modal layout-one">${head()}<div class="content body"><div class="gallery"><div class="hero-art">${art(photo)}<span class="photo-index">${photo+1} / 3</span></div><div class="thumbnails">${[0,1,2].map(i=>`<button class="thumb ${photo===i?'active':''}" data-photo="${i}" aria-label="${T('Image','صورة')} ${i+1}" aria-pressed="${photo===i}">${art(i)}</button>`).join('')}</div><span class="media-note">${T('Illustrative images · sample listing','صور توضيحية · عقار تجريبي')}</span></div><div class="info">${badges()}${title()}${price()}${facts()}${description()}${owner()}${resources()}</div></div>${foot()}</article>`:design===1?`<article class="modal layout-two">${head()}<div class="content"><div class="two-top"><div>${badges()}${title()}</div>${price()}</div><div class="two-panorama">${art()}<span class="photo-index">${T('Illustrative image','صورة توضيحية')} · 1 / 3</span></div>${facts()}<div class="mini-tabs">${[['overview',T('Overview','نظرة عامة')],['contact',T('Owner & links','المالك والروابط')]].map(([id,label])=>`<button data-section="${id}" class="${section===id?'active':''}" aria-pressed="${section===id}">${label}</button>`).join('')}</div>${section==='overview'?`<div class="two-grid"><div>${description()}${resources()}</div>${owner()}</div>`:`<div class="two-details">${owner()}${resources()}</div>`}</div>${foot()}</article>`:`<article class="modal layout-three">${head()}<div class="content"><div class="drawer-cover">${art()}<span class="badge neutral">${T('Illustrative image','صورة توضيحية')} · 1 / 3</span></div><div class="info">${badges()}${title()}${price()}${facts()}<details class="drawer-details" open><summary>${T('Property description','وصف العقار')}</summary>${description()}</details>${owner()}<section class="section"><div class="section-head"><h4>${T('Explore & share','روابط ومشاركة')}</h4></div>${resources()}</section></div></div>${foot()}</article>`;
 $('preview').className='frame'+(mobile?' mobile':'')+(design===2?' drawer-frame':'');$('preview').innerHTML=body;$('comparison').innerHTML=`<strong>${T('Best for:','الأنسب لـ:')}</strong> ${[T('Visual browsing and side-by-side image / information review.','التصفح البصري ومراجعة الصور والمعلومات معًا.'),T('Fast price comparisons and a concise property brief.','مقارنة الأسعار بسرعة ومراجعة ملخص العقار.'),T('Staff workflows and reviewing properties without leaving the list.','عمل الموظفين ومراجعة العقارات دون مغادرة القائمة.')][design]}`;$('choose').innerHTML=icon('check')+T('I choose design 0','أختار التصميم 0')+(design+1);$('note').textContent=T('Interactive prototypes only. All owners, prices, locations and images are sample content. Edits stay in this preview; your application and database are unchanged. Tell me the number you prefer to apply it.','هذه نماذج تفاعلية فقط. بيانات الملاك والأسعار والمواقع والصور توضيحية. التعديلات تخص المعاينة ولا تغيّر التطبيق أو قاعدة البيانات. أخبرني برقم التصميم الذي تفضله لتطبيقه.');}
let toastTimer;function toast(text){$('toast').textContent=text;$('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').hidden=true,4500)}
function editDialog(field){editing=field;const p=listings[kind];$('edit-title').textContent={price:T('Edit price','تعديل السعر'),status:T('Edit availability','تعديل التوفر'),owner:T('Edit owner information','تعديل بيانات المالك'),description:T('Edit description','تعديل الوصف'),location:T('Edit location URL','تعديل رابط الموقع'),tiktok:T('Edit TikTok URL','تعديل رابط TikTok')}[field];const input=(key,label,value,type='text')=>`<label>${label}<input name="${key}" type="${type}" value="${E(value)}" required ${key==='price'?'min="1" step="0.01"':''}></label>`;$('edit-fields').innerHTML=field==='owner'?input('owner',T('Owner name','اسم المالك'),p.owner)+input('phone',T('Phone','الهاتف'),p.phone,'tel'):field==='description'?`<label>${T('Description','الوصف')}<textarea name="description" required>${E(p.description[lang==='ar'?1:0])}</textarea></label>`:field==='status'?`<div class="samples">${['available',p.period?'rented':'sold'].map(value=>`<label style="display:flex;align-items:center;gap:7px"><input type="radio" name="status" value="${value}" ${p.status===value?'checked':''} style="width:auto;margin:0">${value==='available'?T('Available','متاح'):value==='rented'?T('Rented','مؤجر'):T('Sold','مباع')}</label>`).join('')}</div>`:input(field,field==='price'?T('Price in SAR','السعر بالريال'):T('URL','الرابط'),p[field]||(field==='location'?'https://maps.google.com/?q=Riyadh':field==='tiktok'?'https://www.tiktok.com/':p.price),field==='price'?'number':'url');$('edit-note').textContent=T('Demo only. Changes affect this preview, not your saved properties.','للتجربة فقط. تؤثر التغييرات على المعاينة وليس العقارات المحفوظة.');$('edit-cancel').textContent=T('Cancel','إلغاء');$('edit-save').textContent=T('Save preview','حفظ المعاينة');$('editor').showModal()}
document.addEventListener('click',async e=>{const el=e.target.closest('button,a');if(!el)return;if(el.dataset.design!==undefined){design=Number(el.dataset.design);section='overview';render()}if(el.dataset.kind!==undefined){kind=Number(el.dataset.kind);photo=0;render()}if(el.dataset.mobile!==undefined){mobile=el.dataset.mobile==='1';render()}if(el.dataset.photo!==undefined){photo=Number(el.dataset.photo);render()}if(el.dataset.section){section=el.dataset.section;render()}if(el.dataset.edit)editDialog(el.dataset.edit);if(el.dataset.copy){const p=listings[kind],field=el.dataset.copy,text=field==='description'?p.description[lang==='ar'?1:0]:field==='owner'?`${p.owner}\n${p.phone}`:p[field]||(field==='location'?'https://maps.google.com/?q=Riyadh':'https://www.tiktok.com/');try{await navigator.clipboard.writeText(text);toast(T('Copied to clipboard','تم النسخ'))}catch{toast(T('Clipboard unavailable in this browser.','النسخ غير متاح في هذا المتصفح.'))}}if(el.hasAttribute('data-close')){ $('preview').innerHTML=`<button class="primary" data-reopen>${icon('eye')}${T('Reopen Quick view','إعادة فتح النظرة السريعة')}</button>`}if(el.hasAttribute('data-reopen'))render();if(el.hasAttribute('data-details')||el.hasAttribute('data-share')||el.dataset.open){e.preventDefault();toast(T('Preview action only — your live property links stay unchanged.','هذا إجراء توضيحي فقط — روابط عقاراتك الفعلية لا تتغير.'))}});
$('language').onclick=()=>{lang=lang==='ar'?'en':'ar';render()};$('choose').onclick=()=>toast(T(`Design 0${design+1} selected. Send “${design+1}” in the chat to apply it.`,`اخترت التصميم 0${design+1}. أرسل «${design+1}» في المحادثة لتطبيقه.`));$('edit-cancel').onclick=()=>$('editor').close();$('edit-form').onsubmit=e=>{e.preventDefault();const values=new FormData(e.target),p=listings[kind];if(editing==='owner'){p.owner=String(values.get('owner'));p.phone=String(values.get('phone'))}else if(editing==='price')p.price=Number(values.get('price'));else if(editing==='description')p.description[lang==='ar'?1:0]=String(values.get('description'));else p[editing]=String(values.get(editing));$('editor').close();render();toast(T('Preview updated','تم تحديث المعاينة'))};render();
</script></body></html>
